trigger:
  branches:
    include:
      - main
  paths:
    include:
      - ClinicWorks-IAC/**
      - ClinicWorks-Backend/**
      - ClinicWorks-Function/**
      - ClinicWorks-Frontend/**

pool:
  vmImage: "ubuntu-latest"

variables:
  - group: clinicworks-dev-secrets

  - name: azureServiceConnection
    value: "sc-clinicworks-azure"

  - name: resourceGroupName
    value: "rg-clinicworks-dev-ci"

  - name: bicepTemplate
    value: "ClinicWorks-IAC/main.bicep"

  - name: bicepParameters
    value: "ClinicWorks-IAC/parameters/dev.bicepparam"

stages:
  # ============================================================
  # BICEP BUILD
  # ============================================================

  - stage: Bicep_Build
    displayName: "Bicep - Build"

    jobs:
      - job: BuildBicep
        displayName: "Build Bicep"

        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: "Build Bicep"
            inputs:
              azureSubscription: "$(azureServiceConnection)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                az bicep build \
                  --file $(bicepTemplate)

  # ============================================================
  # BICEP VALIDATE
  # ============================================================

  - stage: Bicep_Validate
    displayName: "Bicep - Validate"
    dependsOn: Bicep_Build

    jobs:
      - job: ValidateBicep
        displayName: "Validate Bicep Deployment"

        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: "Validate Bicep"
            inputs:
              azureSubscription: "$(azureServiceConnection)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                az deployment group validate \
                  --resource-group $(resourceGroupName) \
                  --template-file $(bicepTemplate) \
                  --parameters projectName=clinicworks \
                  --parameters environment=dev \
                  --parameters regionCode=ci \
                  --parameters instance=004 \
                  --parameters location="Central India" \
                  --parameters postgresAdminUsername=clinicadmin \
                  --parameters postgresAdminPassword="$(postgresAdminPassword)"

  # ============================================================
  # BICEP WHAT-IF
  # ============================================================

  - stage: Bicep_WhatIf
    displayName: "Bicep - What-If"
    dependsOn: Bicep_Validate

    jobs:
      - job: WhatIfBicep
        displayName: "Run Bicep What-If"

        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: "Bicep What-If"
            inputs:
              azureSubscription: "$(azureServiceConnection)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                az deployment group what-if \
                  --resource-group $(resourceGroupName) \
                  --template-file $(bicepTemplate) \
                  --parameters projectName=clinicworks \
                  --parameters environment=dev \
                  --parameters regionCode=ci \
                  --parameters instance=004 \
                  --parameters location="Central India" \
                  --parameters postgresAdminUsername=clinicadmin \
                  --parameters postgresAdminPassword="$(postgresAdminPassword)"

  # ============================================================
  # BICEP DEPLOY
  # ============================================================

  - stage: Bicep_Deploy
    displayName: "Bicep - Deploy Infrastructure"
    dependsOn: Bicep_WhatIf

    jobs:
      - job: DeployBicep
        displayName: "Deploy Bicep Infrastructure"

        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: "Deploy Bicep Infrastructure"
            inputs:
              azureSubscription: "$(azureServiceConnection)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                az deployment group create \
                  --resource-group $(resourceGroupName) \
                  --template-file $(bicepTemplate) \
                  --parameters projectName=clinicworks \
                  --parameters environment=dev \
                  --parameters regionCode=ci \
                  --parameters instance=004 \
                  --parameters location="Central India" \
                  --parameters postgresAdminUsername=clinicadmin \
                  --parameters postgresAdminPassword="$(postgresAdminPassword)"

  # ============================================================
  # BACKEND
  # ============================================================

  - stage: Backend
    displayName: "Backend - Build & Deploy"
    dependsOn: Bicep_Deploy

    jobs:
      - job: DeployBackend
        displayName: "Deploy Backend"

        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.13"
            displayName: "Use Python 3.13"

          - script: |
              cd ClinicWorks-Backend

              python -m pip install --upgrade pip

              pip install -r requirements.txt --target=".python_packages/lib/site-packages"

              PYTHONPATH="$(pwd)/.python_packages/lib/site-packages" python -c "import uvicorn; print('uvicorn version:', uvicorn.__version__)"
              PYTHONPATH="$(pwd)/.python_packages/lib/site-packages" python -c "import gunicorn; print('gunicorn version:', gunicorn.__version__)"
            displayName: "Install backend dependencies"

          - task: ArchiveFiles@2
            inputs:
              rootFolderOrFile: "$(Build.SourcesDirectory)/ClinicWorks-Backend"
              includeRootFolder: false
              archiveType: "zip"
              archiveFile: "$(Build.ArtifactStagingDirectory)/backend.zip"
              replaceExistingArchive: true
            displayName: "Package backend"

          - task: AzureWebApp@1
            inputs:
              azureSubscription: "$(azureServiceConnection)"
              appType: "webAppLinux"
              appName: "app-clinicworks-api-dev-ci-004"
              package: "$(Build.ArtifactStagingDirectory)/backend.zip"
              startUpCommand: "PYTHONPATH=/home/site/wwwroot/.python_packages/lib/site-packages python -m gunicorn -k uvicorn.workers.UvicornWorker app.main:app --bind=0.0.0.0:8000"
              appSettings: >
                -SCM_DO_BUILD_DURING_DEPLOYMENT false
            displayName: "Deploy backend to Azure Web App"

  # ============================================================
  # FUNCTION
  # ============================================================

  - stage: Function
    displayName: "Function - Build & Deploy"
    dependsOn: Bicep_Deploy

    jobs:
      - job: DeployFunction
        displayName: "Deploy Function"

        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.12"
            displayName: "Use Python 3.12"

          - script: |
              cd ClinicWorks-Function/processing_function
              python -m pip install --upgrade pip
              pip install -r requirements.txt --target=".python_packages/lib/site-packages"
            displayName: "Install Function dependencies"

          - task: ArchiveFiles@2
            inputs:
              rootFolderOrFile: "$(Build.SourcesDirectory)/ClinicWorks-Function/processing_function/"
              includeRootFolder: false
              archiveType: "zip"
              archiveFile: "$(Build.ArtifactStagingDirectory)/function.zip"
              replaceExistingArchive: true
            displayName: "Package function"

          - script: |
              echo "===== Function ZIP Contents ====="
              unzip -l "$(Build.ArtifactStagingDirectory)/function.zip"
            displayName: "Verify function ZIP contents"

          - task: AzureFunctionApp@2
            inputs:
              azureSubscription: "$(azureServiceConnection)"
              appType: "functionAppLinux"
              appName: "fn-clinicworks-processing-dev-ci-004"
              package: "$(Build.ArtifactStagingDirectory)/function.zip"
            displayName: "Deploy function to Azure Function App"

  # ============================================================
  # FRONTEND
  # ============================================================

  - stage: Frontend
    displayName: "Frontend - Build & Deploy"
    dependsOn: Bicep_Deploy

    jobs:
      - job: DeployFrontend
        displayName: "Deploy Frontend"

        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.13"
            displayName: "Use Python 3.13"

          - script: |
              cd ClinicWorks-Frontend

              python -m pip install --upgrade pip

              pip install -r requirements.txt --target=".python_packages/lib/site-packages"

              PYTHONPATH="$(pwd)/.python_packages/lib/site-packages" python -c "import streamlit; print('streamlit version:', streamlit.__version__)"
            displayName: "Install frontend dependencies"

          - script: |
              cd ClinicWorks-Frontend

              python -m py_compile app/main.py

            displayName: "Validate frontend code"

          - task: ArchiveFiles@2
            inputs:
              rootFolderOrFile: "$(Build.SourcesDirectory)/ClinicWorks-Frontend"
              includeRootFolder: false
              archiveType: "zip"
              archiveFile: "$(Build.ArtifactStagingDirectory)/frontend.zip"
              replaceExistingArchive: true

            displayName: "Package frontend"

          - script: |
              echo "===== Frontend ZIP Contents ====="
              unzip -l "$(Build.ArtifactStagingDirectory)/frontend.zip"

            displayName: "Verify frontend ZIP contents"

          - task: AzureWebApp@1
            inputs:
              azureSubscription: "sc-clinicworks-azure"
              appType: "webAppLinux"
              appName: "app-clinicworks-ui-dev-ci-004"
              package: "$(Build.ArtifactStagingDirectory)/frontend.zip"

              startUpCommand: >
                PYTHONPATH=/home/site/wwwroot/.python_packages/lib/site-packages
                python -m streamlit run app/main.py
                --server.address=0.0.0.0
                --server.port=8000

              appSettings: >
                -SCM_DO_BUILD_DURING_DEPLOYMENT false

            displayName: "Deploy frontend to Azure Web App"
